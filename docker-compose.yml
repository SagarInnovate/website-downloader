version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: website-downloader-backend
    ports:
      - "8080:8080"
    volumes:
      - ./downloads:/root/downloads
      - ./temp:/root/temp
      - ./backend/config.json:/root/config.json
    environment:
      - GIN_MODE=release
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: website-downloader-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  downloads:
  temp:
